# Custom intents scaffold for Home Assistant
#
# Purpose:
# - Keep a starter place for user-defined intents.
# - Map natural language to intent names, then handle them in intent_script.
#
# Usage:
# 1) Keep this file in your HA custom sentence path (or copy it there).
# 2) Add matching handlers in configuration.yaml -> intent_script.
# 3) Reload Assist/sentence configuration after edits.
#
# Note:
# - Chinese templates are provided in intent/custom_intents_zh.yaml.

language: "en"
intents:
  HVCreateAutomation:
    data:
      - sentences:
          - "create an automation {name}"
          - "create an automation: {name}"
          - "help me create an automation {name}"
          - "create a scheduled task {name}"
          - "create a scheduled task: {name}"
          - "help me create a scheduled task {name}"
          - "create a planned task {name}"
          - "add a scheduled task {name}"

  HVUpdateAutomation:
    data:
      - sentences:
          - "update automation {name}"
          - "update automation: {name}"
          - "modify automation {name}"
          - "update scheduled task {name}"
          - "modify scheduled task {name}"
          - "edit planned task {name}"
          - "change scheduled task to {name}"

  HVDeleteAutomation:
    data:
      - sentences:
          - "delete automation {name}"
          - "delete automation: {name}"
          - "remove automation {name}"
          - "delete scheduled task {name}"
          - "remove scheduled task {name}"
          - "cancel scheduled task {name}"
          - "disable planned task {name}"

  HVCreateScript:
    data:
      - sentences:
          - "create a script {name}"
          - "create a script: {name}"
          - "help me create a script {name}"
          - "add a script {name}"
          - "make a script {name}"

  HVUpdateScript:
    data:
      - sentences:
          - "update script {name}"
          - "update script: {name}"
          - "modify script {name}"
          - "edit script {name}"
          - "change script to {name}"

  HVDeleteScript:
    data:
      - sentences:
          - "delete script {name}"
          - "delete script: {name}"
          - "remove script {name}"
          - "cancel script {name}"
          - "disable script {name}"

  HVConfirmAutomationManage:
    data:
      - sentences:
          - "confirm automation operation"
          - "confirm automation update"
          - "confirm automation delete"
          - "confirm the pending automation change"

  HVConfirmAutomationUpdate:
    data:
      - sentences:
          - "confirm automation update"
          - "confirm updating automation"
          - "confirm the pending automation update"

  HVConfirmAutomationDelete:
    data:
      - sentences:
          - "confirm automation delete"
          - "confirm deleting automation"
          - "confirm the pending automation delete"

  HVConfirmScriptManage:
    data:
      - sentences:
          - "confirm script operation"
          - "confirm script update"
          - "confirm script delete"
          - "confirm the pending script change"

  HVConfirmScriptUpdate:
    data:
      - sentences:
          - "confirm script update"
          - "confirm updating script"
          - "confirm the pending script update"

  HVConfirmScriptDelete:
    data:
      - sentences:
          - "confirm script delete"
          - "confirm deleting script"
          - "confirm the pending script delete"

lists:
  name:
    wildcard: true

  # Example list placeholder (optional)
  # mode_name:
  #   values:
  #     - in: "home"
  #       out: "home"
  #     - in: "away"
  #       out: "away"

expansion_rules:
  # Example expansion placeholder (optional)
  # automation_verb: "create|update|delete"
