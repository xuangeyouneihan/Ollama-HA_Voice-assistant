# Custom intents scaffold for Home Assistant
#
# Purpose:
# - Keep a starter place for user-defined intents.
# - Map natural language to intent names, then handle them in intent_script.
#
# Usage:
# 1) Keep this file in your HA custom sentence path (or copy it there).
# 2) Add matching handlers in configuration.yaml -> intent_script.
# 3) Reload Assist/sentence configuration after edits.
#
# Note:
# - Chinese templates are provided in intent/custom_intents_zh.yaml.

language: "en"
intents:
  HVCreateAutomation:
    data:
      - sentences:
          - "create an automation {text}"
          - "help me create an automation {text}"
          - "create a scheduled task {text}"
          - "help me create a scheduled task {text}"
          - "create a planned task {text}"
          - "add a scheduled task {text}"

  HVUpdateAutomation:
    data:
      - sentences:
          - "update automation {text}"
          - "modify automation {text}"
          - "update scheduled task {text}"
          - "modify scheduled task {text}"
          - "edit planned task {text}"
          - "change scheduled task to {text}"

  HVDeleteAutomation:
    data:
      - sentences:
          - "delete automation {text}"
          - "remove automation {text}"
          - "delete scheduled task {text}"
          - "remove scheduled task {text}"
          - "cancel scheduled task {text}"
          - "disable planned task {text}"

  HVCreateScript:
    data:
      - sentences:
          - "create a script {text}"
          - "help me create a script {text}"
          - "add a script {text}"
          - "make a script {text}"

  HVUpdateScript:
    data:
      - sentences:
          - "update script {text}"
          - "modify script {text}"
          - "edit script {text}"
          - "change script to {text}"

  HVDeleteScript:
    data:
      - sentences:
          - "delete script {text}"
          - "remove script {text}"
          - "cancel script {text}"
          - "disable script {text}"

  HVConfirmAutomationManage:
    data:
      - sentences:
          - "confirm automation operation"
          - "confirm automation update"
          - "confirm automation delete"
          - "confirm the pending automation change"

  HVConfirmScriptManage:
    data:
      - sentences:
          - "confirm script operation"
          - "confirm script update"
          - "confirm script delete"
          - "confirm the pending script change"

lists:
