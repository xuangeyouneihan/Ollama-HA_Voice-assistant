# intent_script template for Home Assistant
#
# This file is a template snippet.
# Copy the `intent_script` section into your Home Assistant configuration.yaml,
# then adjust rest_command names/URLs as needed.
#
# Expected intent names (from custom intents):
# - HVCreateAutomation
# - HVUpdateAutomation
# - HVDeleteAutomation
# - HVCreateScript
# - HVUpdateScript
# - HVDeleteScript
# - HVConfirmAutomationManage
# - HVConfirmScriptManage
#
# Two-step behavior for update/delete:
# 1) First call to manage endpoint returns a confirmation message and a pending action.
# 2) Save confirmation_id from response.
# 3) Call the same manage endpoint again with:
#    {"confirmation_id":"...", "confirm":true, "session_id":"same-as-step1", "expected_operation":"task_update|task_delete"}

intent_script:
  HVCreateAutomation:
    speech:
      text: "Okay, I will create that automation."
    action:
      - service: rest_command.hv_task_create
        data:
          text: "{{ text }}"

  HVUpdateAutomation:
    speech:
      text: "Okay, I will update that automation."
    action:
      - service: rest_command.hv_task_manage_update
        data:
          text: "{{ text }}"

  HVDeleteAutomation:
    speech:
      text: "Okay, I will delete that automation."
    action:
      - service: rest_command.hv_task_manage_delete
        data:
          text: "{{ text }}"

  HVCreateScript:
    speech:
      text: "Okay, I will create that script."
    action:
      - service: rest_command.hv_script_create
        data:
          text: "{{ text }}"

  HVUpdateScript:
    speech:
      text: "Okay, I will update that script."
    action:
      - service: rest_command.hv_script_manage_update
        data:
          text: "{{ text }}"

  HVDeleteScript:
    speech:
      text: "Okay, I will delete that script."
    action:
      - service: rest_command.hv_script_manage_delete
        data:
          text: "{{ text }}"

  HVConfirmAutomationManage:
    speech:
      text: "Okay, I will confirm the pending automation operation."
    action:
      - service: rest_command.hv_task_confirm

  HVConfirmScriptManage:
    speech:
      text: "Okay, I will confirm the pending script operation."
    action:
      - service: rest_command.hv_script_confirm

