intent_script:
  HVCreateAutomation:
    card:
      type: simple
      title: "HV Create Automation"
      content: >-
        {% set r = action_response if action_response is defined else none %}
        {% if r is none %}
          自动化请求已完成，但未收到返回内容。
        {% elif r.status == 200 %}
          {{ r.content.message if r.content is mapping and r.content.message is defined else "自动化已创建。" }}
        {% else %}
          {% set err = "" %}
          {% if r.content is mapping %}
            {% set err = r.content.error if r.content.error is defined else (r.content.detail if r.content.detail is defined else (r.content.message if r.content.message is defined else "")) %}
          {% else %}
            {% set err = r.content | string %}
          {% endif %}
          {{ "自动化创建失败（HTTP " ~ (r.status | string) ~ "）。" ~ ("详情：" ~ err if err else "") }}
        {% endif %}
    speech:
      text: >-
        {% set r = action_response if action_response is defined else none %}
        {% if r is none %}
          [HV] Automation request finished, but no action response was returned.
        {% elif r.status == 200 %}
          {{ r.content.message if r.content is mapping and r.content.message is defined else "[HV] Automation request succeeded." }}
        {% else %}
          {% set err = "" %}
          {% if r.content is mapping %}
            {% set err = r.content.error if r.content.error is defined else (r.content.detail if r.content.detail is defined else (r.content.message if r.content.message is defined else "")) %}
          {% else %}
            {% set err = r.content | string %}
          {% endif %}
          {{ "[HV] Automation request failed (HTTP " ~ (r.status | string) ~ ")." ~ (" Detail: " ~ err if err else "") }}
        {% endif %}
    action:
      - service: rest_command.hv_task_create
        response_variable: result
        data:
          text: "{{ (text if text is defined and (text | trim) else (name if name is defined else '')) | trim }}"
      - stop: ""
        response_variable: result

