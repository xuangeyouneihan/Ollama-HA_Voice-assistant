# intent_script template for Home Assistant
#
# This file is a template snippet.
# Copy the `intent_script` section into your Home Assistant configuration.yaml,
# then adjust rest_command names/URLs as needed.
#
# Expected intent names (from custom intents):
# - HVCreateAutomation
# - HVUpdateAutomation
# - HVDeleteAutomation
#
# Two-step behavior for update/delete:
# 1) First call to manage endpoint returns a confirmation message and a pending action.
# 2) User says a confirmation phrase (e.g. "确认", "确定", "confirm").
# 3) Backend confirms the latest pending action for that operation.
#
# Optional: if your client can pass confirmation_id, call manage endpoint with:
#   {"confirmation_id": "...", "confirm": true, "expected_operation": "task_update|task_delete"}

intent_script:
  HVCreateAutomation:
    speech:
      text: "Okay, I will create that automation."
    action:
      - service: rest_command.hv_task_create
        data:
          text: "{{ text }}"

  HVUpdateAutomation:
    speech:
      text: "Okay, I will update that automation."
    action:
      - service: rest_command.hv_task_manage_update
        data:
          text: "{{ text }}"

  HVDeleteAutomation:
    speech:
      text: "Okay, I will delete that automation."
    action:
      - service: rest_command.hv_task_manage_delete
        data:
          text: "{{ text }}"

# Optional: matching rest_command template (put in configuration.yaml)
# rest_command:
#   hv_task_create:
#     url: "http://<SERVER_IP>:8000/ha-tasks/from-text"
#     method: POST
#     content_type: "application/json"
#     payload: '{"text": "{{ text }}"}'
#
#   hv_task_manage_update:
#     url: "http://<SERVER_IP>:8000/ha-tasks/manage-from-text"
#     method: POST
#     content_type: "application/json"
#     payload: '{"text": "{{ text }}", "expected_operation": "task_update"}'
#
#   hv_task_manage_delete:
#     url: "http://<SERVER_IP>:8000/ha-tasks/manage-from-text"
#     method: POST
#     content_type: "application/json"
#     payload: '{"text": "{{ text }}", "expected_operation": "task_delete"}'
