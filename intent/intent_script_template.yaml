rest_command:
  hv_task_create:
    url: "http://localhost:8000/ha-tasks/from-text"
    method: POST
    content_type: "application/json"
    timeout: 600
    payload: >-
      {{
        {
          "text": text if text is defined else "",
          "language": "zh"
        } | tojson
      }}

  hv_task_manage_update:
    url: "http://localhost:8000/ha-tasks/manage-from-text"
    method: POST
    content_type: "application/json"
    timeout: 600
    payload: >-
      {{
        {
          "text": text if text is defined else "",
          "expected_operation": "task_update",
          "session_id": (conversation_id if conversation_id is defined and conversation_id else "ha_assist"),
          "language": "zh"
        } | tojson
      }}

  hv_task_manage_delete:
    url: "http://localhost:8000/ha-tasks/manage-from-text"
    method: POST
    content_type: "application/json"
    timeout: 600
    payload: >-
      {{
        {
          "text": text if text is defined else "",
          "expected_operation": "task_delete",
          "session_id": (conversation_id if conversation_id is defined and conversation_id else "ha_assist"),
          "language": "zh"
        } | tojson
      }}

  hv_script_create:
    url: "http://localhost:8000/ha-scripts/from-text"
    method: POST
    content_type: "application/json"
    timeout: 600
    payload: >-
      {{
