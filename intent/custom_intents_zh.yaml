# Chinese custom intents for Home Assistant Assist
#
# Intent names are aligned with intent_script handlers:
# - HVCreateAutomation
# - HVUpdateAutomation
# - HVDeleteAutomation
# - HVCreateScript
# - HVUpdateScript
# - HVDeleteScript
# - HVConfirmAutomationManage
# - HVConfirmScriptManage
# - HVConfirmAutomationUpdate
# - HVConfirmAutomationDelete
# - HVConfirmScriptUpdate
# - HVConfirmScriptDelete

language: "zh"
intents:
  HVCreateAutomation:
    data:
      - sentences:
          - "创建自动化 {name}"
          - "创建自动化：{name}"
