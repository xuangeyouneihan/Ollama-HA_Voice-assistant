; PlatformIO configuration for HumbleVoice ESP32 client
; This file is provided for users who prefer PlatformIO over Arduino IDE

[env:esp32-s3-box]
platform = espressif32
board = esp32-s3-box
framework = arduino
lib_deps = 
    links2004/WebSockets@^2.3.7
    bblanchon/ArduinoJson@^6.21.3
monitor_speed = 115200
build_flags = 
    -DCORE_DEBUG_LEVEL=3
upload_protocol = esptool

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
lib_deps = 
    links2004/WebSockets@^2.3.7
    bblanchon/ArduinoJson@^6.21.3
monitor_speed = 115200
build_flags = 
    -DCORE_DEBUG_LEVEL=3
upload_protocol = esptool