# HumbleVoice Server Configuration

server:
  host: 0.0.0.0
  port: 8000
  debug: false

llm:
  engine: ollama
  model: qwen3:8b
  host: http://localhost:11434
  thinking: false
  # Enable two-step reasoning budget flow for qwen3.5 models to reduce overthinking loops.
  qwen35_reasoning_budget_enabled: false
  # Maximum exposed entities appended into planning prompt context.
  exposed_entities_prompt_limit: 80
  temperature: 0
  max_tokens: 500
  timeout: 120
  system_prompt: |
    You are a Home Assistant automation planner.

    Output exactly one valid JSON object.
    No markdown. No explanation. No extra text.
    Do not call tools.
    Do not execute actions or intents directly.
    Never output null (use "" or [] only).
    All keys must be in English.

    Top-level keys (all must exist):
    intent,target_name,new_name,name_specified,summary,expose_to_assist,trigger,condition,action,mode,target_id,confidence,reason,safety

    intent must be one of:
    create,update,delete,enable,disable,trigger,query,clarification_needed,refuse

    Required output shape:
    {
      "intent":"create|update|delete|enable|disable|trigger|query|clarification_needed|refuse",
      "target_name":"",
      "new_name":"",
      "name_specified":false,
      "summary":"",
      "expose_to_assist":"",
      "trigger":[],
      "condition":[],
      "action":[],
      "mode":"single|restart|queued|parallel",
      "target_id":"",
      "confidence":0,
      "reason":"",
      "safety":{"allowed":true,"reason":""}
    }

    Rules:
    1) If information is insufficient, return:
      intent="clarification_needed", short summary, safety.allowed=true.
    2) For non-automation requests, return:
      intent="refuse", safety.allowed=false, reason="non-automation request".
    3) action items must include "action" in domain.service format.
    4) trigger items must include "trigger".
    5) time trigger "at" must be HH:MM or HH:MM:SS.
    6) entity_id or target.entity_id must be entity IDs, never service names.
    7) For create: default expose_to_assist=true unless user explicitly opts out.
    8) For non-create intents: expose_to_assist="".
    9) Never output empty placeholder objects in arrays.

    Critical target_id rule:
    - target_id and confidence are RESERVED top-level fields for task="native_match_automation" only.
    - For all other tasks, always output:
      "target_id":"", "confidence":0
    - Never place target_id inside action/trigger/condition.
    - In actions, use target.entity_id (or data.entity_id) only.

    native_match_automation rule:
    - Choose target_id only from provided candidates.

home_assistant:
  enabled: true
  # url: http://homeassistant.local:8123
  url: http://localhost:8123
  # Home Assistant configuration directory on local filesystem.
  # automation_manager writes automations directly to <config_dir>/automations.yaml
  config_dir: /var/lib/homeassistant/homeassistant
  # Pre-write backup settings for automations.yaml
  # Backup files are stored as: automations.<timestamp>.<id>.yaml.bak
  automation_backup_dir: /var/lib/homeassistant/homeassistant/backups/automations
  automation_backup_keep: 20
  # Planner retries after dry-run validation fails. Total attempts = retry_max + 1.
  automation_plan_retry_max: 2
  # Auto expose newly created automations to Assist conversation unless explicitly opted out in user text.
  automation_auto_expose_default: true
  # Restrict update/delete matching to automations exposed to Assist conversation.
  manage_only_exposed_automations: true
  # Audio requests are always forwarded to HA Assist pipeline.
  # Optional pipeline id. Leave empty to use HA default Assist pipeline.
  assist_pipeline_id: ""
  # Timeout for HA Assist websocket run.
  assist_audio_timeout_s: 45
  auto_discover: true
  automation_conversation_agent: conversation.automation_manager
  automation_api_timeout_s: 60

audio:
  sample_rate: 44100
  input_channels: 1
  output_channels: 2
  input_device: 6
  output_device: 6
  format: int16
  # 0 means host picks the optimal blocksize automatically.
  # This often reduces input_overflow on startup for USB/Pulse/ALSA devices.
  buffer_size: 0
  # Ignore transient startup overflow warnings in the first N ms.
  overflow_grace_ms: 300
  monitor_input: false
  input_gain: 1
  start_drop_ms: 0

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
