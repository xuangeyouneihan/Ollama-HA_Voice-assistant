# HumbleVoice Server Configuration

server:
  host: 0.0.0.0
  port: 8000
  debug: false

stt:
  engine: wyoming
  host: 127.0.0.1
  port: 10400
  language: zh_CN
  sample_rate: 16000
  sample_width: 2 # bytes, 16-bit
  channels: 1

tts:
  engine: wyoming
  host: 127.0.0.1
  port: 10400
  voice: vits-melo-tts-zh_en
  sample_rate: 16000
  sample_width: 2
  channels: 1

llm:
  engine: ollama
  model: qwen3:14b
  host: http://localhost:11434
  temperature: 0.6
  max_tokens: 500
  timeout: 120

home_assistant:
  enabled: true
  url: http://homeassistant.local:8123
  auto_discover: true

audio:
  sample_rate: 16000
  channels: 1
  format: int16
  buffer_size: 1024

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
