# HumbleVoice Server Configuration

server:
  host: 0.0.0.0
  port: 8000
  debug: false

llm:
  engine: ollama
  model: qwen3.5:9b
  host: http://localhost:11434
  thinking: false
  temperature: 0.6
  max_tokens: 500
  timeout: 120
  system_prompt: |
    You are a voice assistant for Home Assistant.
    Answer questions about the world truthfully.
    Answer in plain text. Keep it simple and to the point.
    Always reply in the same language the user speaks. Never switch languages unless the user explicitly asks.

home_assistant:
  enabled: true
  url: http://homeassistant.local:8123
  # Home Assistant configuration directory on local filesystem.
  # automation_manager writes automations directly to <config_dir>/automations.yaml
  config_dir: /var/lib/homeassistant/homeassistant
  # Pre-write backup settings for automations.yaml
  # Backup files are stored as: automations.<timestamp>.<id>.yaml.bak
  automation_backup_dir: /var/lib/homeassistant/homeassistant/backups/automations
  automation_backup_keep: 20
  # Planner retries after dry-run validation fails. Total attempts = retry_max + 1.
  automation_plan_retry_max: 2
  # Auto expose newly created automations to Assist conversation unless explicitly opted out in user text.
  automation_auto_expose_default: true
  # Restrict update/delete matching to automations exposed to Assist conversation.
  manage_only_exposed_automations: true
  # Audio requests are always forwarded to HA Assist pipeline.
  # Optional pipeline id. Leave empty to use HA default Assist pipeline.
  assist_pipeline_id: ""
  # Timeout for HA Assist websocket run.
  assist_audio_timeout_s: 45
  auto_discover: true
  automation_conversation_agent: conversation.automation_manager

audio:
  sample_rate: 44100
  input_channels: 1
  output_channels: 2
  input_device: 6
  output_device: 6
  format: int16
  # 0 means host picks the optimal blocksize automatically.
  # This often reduces input_overflow on startup for USB/Pulse/ALSA devices.
  buffer_size: 0
  # Ignore transient startup overflow warnings in the first N ms.
  overflow_grace_ms: 300
  monitor_input: false
  input_gain: 1
  start_drop_ms: 0

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
