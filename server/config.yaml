# HumbleVoice Server Configuration

server:
  host: 0.0.0.0
  port: 8000
  debug: false

stt:
  engine: wyoming
  host: 127.0.0.1
  port: 10400
  language: zh-CN
  sample_rate: 48000
  sample_width: 2 # bytes, 16-bit
  channels: 1
  target_sample_rate: 16000
  target_sample_width: 2
  target_channels: 1
  chunk_ms: 30

tts:
  engine: wyoming
  host: 127.0.0.1
  port: 10400
  voice: vits-melo-tts-zh_en
  sample_rate: 48000
  sample_width: 2
  channels: 2

llm:
  engine: ollama
  model: qwen3.5:9b
  host: http://localhost:11434
  thinking: false
  temperature: 0.6
  max_tokens: 500
  timeout: 120
  system_prompt: |
    You are a voice assistant for Home Assistant.
    Answer questions about the world truthfully.
    Answer in plain text. Keep it simple and to the point.

home_assistant:
  enabled: true
  url: http://homeassistant.local:8123
  # Set to true to bypass local STT/LLM/TTS and forward raw audio to HA Assist pipeline.
  assist_audio_mode: false
  # Optional pipeline id. Leave empty to use HA default Assist pipeline.
  assist_pipeline_id: ""
  # Input sample rate sent to HA Assist (should match device capture rate).
  assist_audio_sample_rate: 16000
  # Timeout for HA Assist websocket run.
  assist_audio_timeout_s: 45
  auto_discover: true

audio:
  sample_rate: 48000
  input_channels: 1
  output_channels: 2
  input_device: 6
  output_device: 6
  format: int16
  buffer_size: 2048
  monitor_input: false
  input_gain: 1
  start_drop_ms: 0

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
