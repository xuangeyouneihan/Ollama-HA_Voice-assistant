# HumbleVoice Server Configuration

server:
  host: 0.0.0.0
  port: 8000
  debug: false

stt:
  engine: wyoming
  host: 127.0.0.1
  port: 10400
  language: zh-CN
  sample_rate: 48000
  sample_width: 2 # bytes, 16-bit
  channels: 1
  target_sample_rate: 16000
  target_sample_width: 2
  target_channels: 1
  chunk_ms: 30
  read_timeout_s: 1.2
  retry_on_garbled: true

tts:
  engine: wyoming
  host: 127.0.0.1
  port: 10400
  voice: vits-melo-tts-zh_en
  sample_rate: 48000
  sample_width: 2
  channels: 2

llm:
  engine: ollama
  model: qwen3:14b
  host: http://localhost:11434
  temperature: 0.6
  max_tokens: 500
  timeout: 120
  system_prompt: |
    You are a Home Assistant voice assistant.
    For smart-home tasks, always rely on provided Home Assistant entities/services context.
    Never invent entities, states, services, or capabilities outside provided context.
    If context is insufficient, explicitly say you do not know.
    Keep replies concise and plain text.

home_assistant:
  enabled: true
  url: http://homeassistant.local:8123
  auto_discover: true
  response_language: zh-CN
  default_area: 客厅
  area_aliases:
    客厅:
      - 客厅
      - 大厅
      - living room
      - livingroom

presets:
  storage_file: server/data/presets.json

audio:
  sample_rate: 48000
  input_channels: 1
  output_channels: 2
  input_device: 6
  output_device: 6
  format: int16
  buffer_size: 2048
  monitor_input: false
  input_gain: 1
  start_drop_ms: 0
  trim_silence: true
  silence_threshold: 700
  silence_keep_ms: 120
  silence_threshold_min: 120
  silence_threshold_ratio: 0.22
  silence_smooth_ms: 20
  silence_max_head_trim_ms: 300
  debug_save_wav: false
  debug_wav_path: server/debug_last_record.wav

logging:
  level: INFO
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
